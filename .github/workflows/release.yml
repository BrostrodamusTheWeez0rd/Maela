name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mæla
        shell: cmd
        run: scripts\build_ci.cmd
      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist\Maela.exe,dist\README.md,dist\LICENSE,dist\VERSION,dist\MaelaLogo.png -DestinationPath "release\Maela-v$version-windows.zip" -Force
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release create "${{ github.ref_name }}" "release\Maela-v$version-windows.zip" --title "mæla v$version" --generate-notes
