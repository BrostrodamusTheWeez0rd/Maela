name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Maela
        shell: cmd
        run: scripts\build_ci.cmd

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Maela.exe")) {
            throw "dist/Maela.exe was not created"
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/Maela.exe#Maela.exe" `
            --title "Maela ${{ github.ref_name }}" `
            --generate-notes
